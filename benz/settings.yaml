# Fuels to report: benzinas_95, dyzelinas, snd (LPG)
fuels:
  - benzinas_95

# Matched as a substring of the ENA "municipality" field (case-insensitive).
# Add "Vilniaus r" to include the district around the city.
municipalities:
  - Vilniaus m

# How many stations to list per fuel
top: 5

# Ignore stations whose last price report is older than this
max_age_hours: 36

# Your discount per brand, in cents per litre. The brand name is matched as a
# case-insensitive substring of the station's company / station name.
# Run `python benz.py --brands` to see the exact names in the ENA data.
# On Wednesdays, Viada uses the Super trečiadieniai price instead (no stacking).
discounts_cents:
  Viada: 0
  Circle K: 0
  Orlen: 3.5
  Neste: 0
  Baltic Petroleum: 0
  Alauša: 0
  Emsi: 0
  Skulas: 0
  Jozita: 0
  Saurida: 0
  Stateta: 0
