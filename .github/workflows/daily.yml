name: Daily fuel prices

on:
  # Started every day at 12:00 Vilnius by cron-job.org through the GitHub API
  # (GitHub's own schedule ran late or not at all). Can also be run by hand.
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r benz/requirements.txt
      # Last sent prices, so the message can show the change since the previous one.
      - uses: actions/cache/restore@v5
        with:
          path: benz/last_prices.json
          key: last-prices-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: last-prices-
      - run: python benz/benz.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v5
        if: hashFiles('benz/last_prices.json') != ''
        with:
          path: benz/last_prices.json
          key: last-prices-${{ github.run_id }}-${{ github.run_attempt }}
