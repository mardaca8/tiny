name: Daily fuel prices

on:
  schedule:
    # 11:45 Vilnius = 08:45 UTC in summer, 09:45 UTC in winter; the script skips the wrong one.
    # GitHub often starts scheduled runs late (and may drop them on the hour), so aim before 12:00.
    - cron: "45 8 * * *"
    - cron: "45 9 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r benz/requirements.txt
      # Last sent prices, so the message can show the change since the previous one.
      - uses: actions/cache/restore@v5
        with:
          path: benz/last_prices.json
          key: last-prices-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: last-prices-
      - run: python benz/benz.py
        env:
          SCHEDULE: ${{ github.event.schedule }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v5
        if: hashFiles('benz/last_prices.json') != ''
        with:
          path: benz/last_prices.json
          key: last-prices-${{ github.run_id }}-${{ github.run_attempt }}
