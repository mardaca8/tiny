name: Daily fuel prices

on:
  schedule:
    # 12:00 Vilnius = 09:00 UTC in summer, 10:00 UTC in winter; the script skips the wrong one.
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r benz/requirements.txt
      - run: python benz/benz.py
        env:
          SCHEDULE: ${{ github.event.schedule }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
